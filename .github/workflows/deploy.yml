name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for actions/checkout

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy xgboost

      - name: Execute Test Suite
        run: |
          python tests/run_tests.py

  deploy:
    name: Deploy Frontend & Lambdas
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Determine Authentication Strategy
        id: auth-check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "auth_mode=keys" >> $GITHUB_OUTPUT
            echo "has_keys=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "auth_mode=oidc_custom" >> $GITHUB_OUTPUT
            echo "has_keys=false" >> $GITHUB_OUTPUT
          else
            echo "auth_mode=oidc_default" >> $GITHUB_OUTPUT
            echo "has_keys=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials (Access Keys)
        if: steps.auth-check.outputs.auth_mode == 'keys'
        id: aws-auth-keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Configure AWS Credentials (Custom OIDC Role)
        if: steps.auth-check.outputs.auth_mode == 'oidc_custom'
        id: aws-auth-oidc
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsAqiDeploy
          retry-max-attempts: 1

      - name: Configure AWS Credentials (Default OIDC Role)
        if: steps.auth-check.outputs.auth_mode == 'oidc_default'
        id: aws-auth-default
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-aqi-deploy-role
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsAqiDeploy
          retry-max-attempts: 1

      - name: Evaluate Authentication
        id: auth-eval
        if: always()
        run: |
          if [ "${{ steps.aws-auth-keys.outcome }}" = "success" ] || \
             [ "${{ steps.aws-auth-oidc.outcome }}" = "success" ] || \
             [ "${{ steps.aws-auth-default.outcome }}" = "success" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✅ Authenticated with AWS successfully."
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "ℹ️  AWS credentials not available or role not assumed."
          fi

      - name: Deploy Frontend to S3 Website
        if: steps.auth-eval.outputs.ready == 'true'
        run: |
          aws s3 sync frontend/src/ s3://aqi-frontend-${{ vars.AWS_ACCOUNT_ID }}/ --delete

      - name: Deploy Backend Lambdas
        if: steps.auth-eval.outputs.ready == 'true'
        env:
          ML_LAYER_ARN: ${{ secrets.ML_LAYER_ARN }}
        run: |
          python backend/deploy_real_mode.py

      - name: Deployment Information Notice
        if: steps.auth-eval.outputs.ready != 'true'
        run: |
          echo "=========================================================================="
          echo "ℹ️  Unit tests passed successfully! AWS deployment skipped."
          echo ""
          echo "To enable automated CI/CD deployments to AWS S3 & Lambda:"
          echo "Option A (OIDC): Run 'python infra/setup_github_oidc.py' using AWS admin creds"
          echo "                 to provision the GitHub Actions OIDC deploy role in AWS."
          echo "Option B (Secrets): Set repository secrets in GitHub Settings > Secrets:"
          echo "                    - AWS_ACCESS_KEY_ID"
          echo "                    - AWS_SECRET_ACCESS_KEY"
          echo "                    - (Optional) ML_LAYER_ARN"
          echo "=========================================================================="
